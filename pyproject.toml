[project]
name = "saga"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Bigfootpp", email = "97189022+Bigfootpp@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "standard"
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
